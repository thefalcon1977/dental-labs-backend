[project]
name = "microservice-fastapi-template"
version = "0.3.33"
description = ""
authors = [
    {name = "Sepehr Akbarzadeh",email = "sa.goldeneagle@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "dynaconf (>=3.2.12,<4.0.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "cryptography (>=46.0.3,<47.0.0)",
    "prometheus-client (>=0.23.1,<0.24.0)",
    "typer (>=0.21.0,<0.22.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "orjson (>=3.11.5,<4.0.0)",
    "uvloop (>=0.22.1,<0.23.0) ; platform_system != 'Windows'",
    "psutil (>=6.1.0,<7.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "gputil (>=1.4.0,<2.0.0)",
    "setuptools (>=80.10.1,<81.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi-debug-toolbar (>=0.6.3,<0.7.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "urllib3 (>=2.6.3)",
    "tzdata (>=2025.3,<2026.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
black = "^25.12.0"
ruff = "^0.14.10"
isort = "^7.0.0"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
commitizen = "^4.11.0"
bandit = "^1.9.3"
safety = "^3.7.0"
pip-audit = "^2.10.0"


[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.poetry.group.doc.dependencies]
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.1.0"
sphinxcontrib-applehelp = "^2.0.0"
sphinxcontrib-devhelp = "^2.0.0"
sphinxcontrib-htmlhelp = "^2.1.0"
sphinxcontrib-jquery = "^4.1"
sphinxcontrib-jsmath = "^1.0.1"
sphinxcontrib-qthelp = "^2.0.0"
sphinxcontrib-serializinghtml = "^2.0.0"
myst-parser = "^5.0.0"

[tool.poetry.group.s3.dependencies]
aioboto3 = "^15.5.0"
# Note: aiobotocore/botocore constraints may prevent urllib3 updates
# Monitor for updates: poetry show --outdated
